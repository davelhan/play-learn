name: QA3 Browser Interaction

# Full regression also guards the English-only localization build.
on:
  push:
    branches: [ main ]
    paths:
      - 'campaign/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/qa3-rework-browser.mjs'
      - 'scripts/qa3-custom-browser.mjs'
      - '.github/workflows/qa3-browser.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'campaign/**'
      - 'assets/**'
      - 'data/**'
      - 'scripts/qa3-rework-browser.mjs'
      - 'scripts/qa3-custom-browser.mjs'
      - '.github/workflows/qa3-browser.yml'
      - 'qa3/**'
  workflow_dispatch:

concurrency:
  group: qa-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/playlearn-http.log 2>&1 &
          sleep 2
      - name: Run shared-engine shard
        env:
          QA_SHARD_TOTAL: 3
          QA_SHARD_INDEX: ${{ matrix.shard }}
        run: node scripts/qa3-rework-browser.mjs
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa5-browser-shared-${{ matrix.shard }}
          path: |
            qa3-rework-results-shard-${{ matrix.shard }}.json
            qa3-rework-results-shard-${{ matrix.shard }}.md
          if-no-files-found: warn

  custom:
    name: custom-9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/playlearn-http.log 2>&1 &
          sleep 2
      - name: Run 9 custom missions end-to-end
        run: node scripts/qa3-custom-browser.mjs
      - name: Upload custom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa5-browser-custom
          path: |
            qa3-custom-results.json
            qa3-custom-results.md
          if-no-files-found: warn
